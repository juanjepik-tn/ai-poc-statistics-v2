<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" fill="none">
  <rect x="10" y="10" width="260" height="140" rx="16" fill="#F0F7FF"/>

  <!-- LEFT: Active state (BEFORE) -->
  <g transform="translate(30, 24)">
    <path d="M36 6L12 16v20c0 16 10 30 24 36 14-6 24-20 24-36V16L36 6z" fill="#0050C3" stroke="#003D99" stroke-width="1.5"/>
    <rect x="26" y="32" width="20" height="16" rx="4" fill="white"/>
    <path d="M30 32v-4c0-3.3 2.7-6 6-6s6 2.7 6 6v4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <circle cx="36" cy="39" r="2" fill="#0050C3"/>
    <rect x="35" y="40" width="2" height="4" rx="1" fill="#0050C3"/>
    <rect x="14" y="68" width="44" height="20" rx="10" fill="#0050C3" stroke="#003D99" stroke-width="1"/>
    <circle cx="46" cy="78" r="7" fill="white"/>
    <text x="26" y="82" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="white">ON</text>
    <text x="36" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0050C3">Ativa</text>
  </g>

  <!-- CENTER: Arrow (transition) -->
  <g transform="translate(118, 48)">
    <rect x="0" y="10" width="44" height="4" rx="2" fill="#25D366"/>
    <polygon points="44,6 54,12 44,18" fill="#25D366"/>
    <text x="27" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#666">desativar</text>
  </g>

  <!-- RIGHT: Deactivated state (AFTER) -->
  <g transform="translate(178, 24)">
    <path d="M36 6L12 16v20c0 16 10 30 24 36 14-6 24-20 24-36V16L36 6z" fill="#F5F8FC" stroke="#C9D2DF" stroke-width="1.5"/>
    <rect x="26" y="32" width="20" height="16" rx="4" fill="#E5E7EB"/>
    <path d="M30 32v-4c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="none" stroke="#C9D2DF" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 28v-4" fill="none" stroke="#C9D2DF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"/>
    <circle cx="36" cy="39" r="2" fill="#C9D2DF"/>
    <rect x="35" y="40" width="2" height="4" rx="1" fill="#C9D2DF"/>
    <rect x="14" y="68" width="44" height="20" rx="10" fill="white" stroke="#C9D2DF" stroke-width="1.5"/>
    <circle cx="26" cy="78" r="7" fill="#C9D2DF"/>
    <text x="42" y="82" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#AAA">OFF</text>
    <text x="36" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#999">Inativa</text>
  </g>

  <!-- Green check (bottom right) -->
  <circle cx="246" cy="120" r="10" fill="#25D366"/>
  <path d="M241 120l3 3 6-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clock badge (temporary) -->
  <g transform="translate(118, 90)">
    <circle cx="22" cy="12" r="11" fill="white" stroke="#0050C3" stroke-width="1.2"/>
    <path d="M22 7v6l3 2" stroke="#0050C3" stroke-width="1.3" stroke-linecap="round"/>
    <text x="22" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#666">temporario</text>
  </g>
</svg>

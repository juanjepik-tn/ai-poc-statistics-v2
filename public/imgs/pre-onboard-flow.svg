<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- Background -->
  <rect x="10" y="10" width="220" height="140" rx="16" fill="#F0F7FF"/>

  <!-- Step 1: Our Platform -->
  <g transform="translate(18, 45)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="white" stroke="#0050C3" stroke-width="1.5"/>
    <!-- App icon -->
    <rect x="10" y="10" width="36" height="36" rx="8" fill="#0050C3"/>
    <rect x="16" y="20" width="24" height="3" rx="1.5" fill="white" opacity="0.8"/>
    <rect x="16" y="26" width="16" height="3" rx="1.5" fill="white" opacity="0.6"/>
    <rect x="16" y="32" width="20" height="3" rx="1.5" fill="white" opacity="0.5"/>
  </g>
  <text x="46" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0050C3">Plataforma</text>

  <!-- Arrow 1 -->
  <g transform="translate(78, 68)">
    <line x1="0" y1="5" x2="20" y2="5" stroke="#0050C3" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="20,1 28,5 20,9" fill="#0050C3"/>
  </g>

  <!-- Step 2: Meta -->
  <g transform="translate(92, 45)">
    <rect x="18" y="0" width="56" height="56" rx="12" fill="white" stroke="#0050C3" stroke-width="1.5"/>
    <circle cx="46" cy="28" r="18" fill="#0050C3" opacity="0.1"/>
    <circle cx="46" cy="28" r="14" fill="#0050C3"/>
    <text x="46" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">M</text>
  </g>
  <text x="138" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0050C3">Meta</text>

  <!-- Arrow 2 -->
  <g transform="translate(162, 68)">
    <line x1="0" y1="5" x2="20" y2="5" stroke="#25D366" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="20,1 28,5 20,9" fill="#25D366"/>
  </g>


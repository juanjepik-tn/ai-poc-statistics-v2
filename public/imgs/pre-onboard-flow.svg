    <circle cx="42" cy="28" r="18" fill="#25D366" opacity="0.1"/>
    <circle cx="42" cy="28" r="14" fill="#25D366"/>
    <!-- WA icon simplified -->
    <path d="M38 33c-.3-.15-1.2-.6-1.4-.68-.16-.08-.28-.12-.4.12-.12.24-.48.68-.6.84-.1.14-.22.16-.4.06-.56-.26-1.04-.56-1.44-.96-.4-.4-.68-.84-.8-1.04-.08-.2 0-.32.08-.4.08-.12.2-.24.28-.36.06-.1.12-.2.16-.3.03-.05.04-.1.04-.16s-.04-.1-.04-.16c0-.1-.44-1.08-.6-1.48-.16-.4-.32-.34-.44-.34h-.36c-.2 0-.44.08-.6.28-.14.2-.32.44-.4.7-.08.26-.14.56-.1.88.06.76.32 1.48.76 2.08.76 1.24 1.8 2.24 3.04 2.84.44.2.76.32 1.04.42.4.12.76.16 1.16.1.24-.06.48-.18.68-.34.2-.16.38-.36.48-.6.12-.28.14-.6.1-.9-.05-.08-.16-.14-.36-.24z" fill="white"/>
  </g>
  <text x="232" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#25D366">WhatsApp</text>

  <!-- Step numbers -->
  <circle cx="46" cy="130" r="8" fill="#0050C3"/>
  <text x="46" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white">1</text>
  <circle cx="138" cy="130" r="8" fill="#0050C3"/>
  <text x="138" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white">2</text>
  <circle cx="232" cy="130" r="8" fill="#25D366"/>
  <text x="232" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white">3</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- Background -->
  <circle cx="120" cy="80" r="70" fill="#FFF8E6"/>

  <!-- Platform A (left) -->
  <rect x="28" y="42" width="72" height="76" rx="10" fill="white" stroke="#0050C3" stroke-width="2"/>
  <rect x="38" y="52" width="52" height="8" rx="4" fill="#DEF0FF"/>
  <rect x="38" y="66" width="40" height="6" rx="3" fill="#E8F5FF"/>
  <rect x="38" y="78" width="46" height="6" rx="3" fill="#E8F5FF"/>
  <!-- Green connected badge -->
  <circle cx="64" cy="102" r="8" fill="#25D366"/>
  <path d="M60 102l3 3 5-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Platform B (right) -->
  <rect x="140" y="42" width="72" height="76" rx="10" fill="white" stroke="#C9D2DF" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="150" y="52" width="52" height="8" rx="4" fill="#F5F5F5"/>
  <rect x="150" y="66" width="40" height="6" rx="3" fill="#F5F5F5"/>
  <rect x="150" y="78" width="46" height="6" rx="3" fill="#F5F5F5"/>
  <!-- Red disconnected badge -->
  <circle cx="176" cy="102" r="8" fill="#E05050"/>
  <path d="M173 99l6 6M179 99l-6 6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Warning triangle in center -->
  <g transform="translate(105, 55)">
    <path d="M15 0L30 26H0Z" fill="#F5A623" stroke="#E0960A" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="15" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white">!</text>
  </g>

  <!-- "vs" / conflict arrows -->
  <path d="M100 80 L110 80" stroke="#E0960A" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 80 L140 80" stroke="#E0960A" stroke-width="2" stroke-linecap="round"/>

  <!-- Decorative -->
  <circle cx="24" cy="34" r="4" fill="#F5A623" opacity="0.2"/>
  <circle cx="216" cy="34" r="4" fill="#F5A623" opacity="0.2"/>
</svg>
